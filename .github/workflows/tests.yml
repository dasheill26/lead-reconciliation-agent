name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Run agent end-to-end (simulated mode, no API key needed)
        run: python run.py --once

      - name: Build Docker image
        run: docker build -t lead-reconciliation-agent-test .

      - name: Run agent inside the built image
        run: docker run --rm lead-reconciliation-agent-test
